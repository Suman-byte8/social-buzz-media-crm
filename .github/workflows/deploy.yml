name: Deploy to Hostinger

on:
  push:
    branches:
      - main   # change to your production branch name if different

# Prevents two deploys running at the same time and stepping on each other
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: production   # optional: set up an "environment" in repo Settings for manual approval + secrets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- OPTIONAL BUILD STEP ----
      # Remove this block if your site is plain static/PHP with no build process.
      # Keep it if you use npm to compile assets (Tailwind, Vite, Sass, bundlers, etc.)
      - name: Setup Node.js
        if: hashFiles('client/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        if: hashFiles('client/package.json') != ''
        working-directory: client
        run: npm ci

      - name: Build and export client
        if: hashFiles('client/package.json') != ''
        working-directory: client
        run: npm run export
      # ---- END OPTIONAL BUILD STEP ----

      - name: Deploy via FTP (plain - last attempt)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp                      
          local-dir: ./client/out/            
          server-dir: ./  
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
            **/README.md
            **/.env
            **/.env.*
          dangerous-clean-slate: false
          log-level: verbose